<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
       
        <title>mon tableau HTML</title>
        <link rel="stylesheet"href="tableau.css">

    </head>
    <body>
        <h1>mon tableau</h1>
        <table>
            <tr> 
                <!--ligne des titres(en-tete du tableau)-->
                <th>ID</th>
                <th>NOM</th>
                <th>PRENOM</th>
                <th>DATE DE NAISSANCE</th>
                <th>VILLAGE</th>
            </tr>

            <tr>
                <!--PREMIER PERSONNE-->
                <td>1</td>
                <td>ALI</td>
                <td>SAID</td>
                <td>12/12/2012</td>
                <td>COMBANI</td>

            </tr>
            <tr>
                <!--DEUXIEME PERSONNE-->
                <td>2</td>
                <td>BACAR</td>
                <td>KOUTSOU</td>
                <td>25/03/1902</td>
                <td>MAMOUDZOU</td>
            </tr>
            <tr>
                <!--TROISIEME PERSONNE-->
                <td>3</td>
                <td>MDERE</td>
                <td>ZENA</td>
                <td>13/04/1920</td>
                <td>PAMANDZI</td>
            </tr>
            <tr>
                <!--QUATRIEME PERSONNE-->
                <td>4</td>
                <td>YOUNOUSSA</td>
                <td>BAMANA</td>
                <td>04/04/1936</td>
                <td>KANI-KELI</td>
            </tr>
        </table>





        
    </body>

</html>
